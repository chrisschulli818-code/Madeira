# Blueprint do Render: publica o WoodCraft Planner como site estático.
# No painel do Render: New → Blueprint → selecione este repositório.
# O assistente "Montar com IA" precisa de servidor: para usá-lo com o Gemini, publique como Web Service
# (yarn start) com a variável GEMINI_API_KEY — veja o README. No site estático ele usa o leitor simples.
services:
  - type: web
    name: woodcraft-planner
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      # SPA: qualquer rota volta para o index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
